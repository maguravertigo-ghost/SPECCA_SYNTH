<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPESSA Studio</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>

<header class="menubar">
    <div class="menubar-logo">🎹 <span>SPESSA</span></div>
    <nav class="menubar-menus">
        <div class="menu" data-menu="file">
            <button class="menu-btn" type="button">File</button>
            <div class="menu-dropdown">
                <button data-action="file-new">New Project</button>
                <button data-action="file-open">Open MIDI…</button>
                <button data-action="file-open-project">Open Project…</button>
				<button data-action="file-project-settings">Project Settings…</button>
                <div class="menu-sep"></div>
                <button data-action="file-save">Save</button>
                <button data-action="file-save-as">Save As MIDI…</button>
            </div>
        </div>
        <div class="menu" data-menu="edit">
            <button class="menu-btn" type="button">Edit</button>
            <div class="menu-dropdown">
                <button data-action="edit-undo" disabled>Undo</button>
                <button data-action="edit-redo" disabled>Redo</button>
                <div class="menu-sep"></div>
                <button data-action="edit-cut">Cut</button>
                <button data-action="edit-copy">Copy</button>
                <button data-action="edit-paste">Paste</button>
                <button data-action="edit-delete">Delete</button>
            </div>
        </div>
        <div class="menu" data-menu="player">
            <button class="menu-btn" type="button">Player</button>
            <div class="menu-dropdown">
                <button data-action="player-open">Open Player… <span class="menu-hint">F5</span></button>
                <div class="menu-sep"></div>
                <button data-action="player-mixer">Mixer…</button>
                <div class="menu-sep"></div>
                <button data-action="player-save-playlist">Save Playlist</button>
                <button data-action="player-clear-playlist">Clear Playlist</button>
            </div>
        </div>
    </nav>
    <div class="menubar-right">
        <label class="sample-rate">
            <span>SR</span>
            <select id="sampleRateSelect">
                <option value="auto">Auto</option>
                <option value="44100">44.1 kHz</option>
                <option value="48000">48 kHz</option>
                <option value="96000">96 kHz</option>
            </select>
        </label>
        <meter class="audio-meter" min="0" max="1" value="0" aria-label="Audio output level" title="Audio output level"></meter>
        <button id="audioUnlock" class="btn audio-enable" type="button">Enable audio</button>
        <span id="audioState" class="audio-state" role="status">Audio off · press Play</span>
        <span id="status" class="app-status"></span>
    </div>
</header>

<div class="workspace">
    <div id="arrangerRoot" class="arranger-root"></div>
    <div id="editorRoot" class="editor-root" style="display:none"></div>
</div>

<section id="logPanel" class="log-panel">
    <div class="log-header">
        <span>Log</span>
        <div>
            <button id="copyBtn" class="btn btn-ghost" type="button">Copy</button>
            <button id="toggleLogBtn" class="btn btn-ghost" type="button">Toggle</button>
        </div>
    </div>
    <div id="logBox" class="log-box"></div>
</section>

<!-- PLAYER OVERLAY -->
<div id="playerOverlay" class="player-overlay hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="MIDI preview">
    <div class="player-shell">
        <div class="player-header">
            <h2>Player</h2>
            <button id="playerCloseBtn" class="btn btn-ghost" type="button">✕ Close</button>
        </div>

        <div class="player-transport">
            <button id="ptPrevious" class="btn" type="button" aria-label="Previous track">⏮</button>
            <button id="ptPlay"  class="btn btn-play" type="button">▶</button>
            <button id="ptPause" class="btn" type="button">Pause</button>
            <button id="ptStop"  class="btn" type="button">Stop</button>
            <button id="ptNext" class="btn" type="button" aria-label="Next track">⏭</button>
            <label class="arr-volume" title="When the original MIDI sounds wrong, try remapping voices to the loaded SoundFont">
                <input id="ptCompatible" type="checkbox"> Compatible
            </label>
            <input id="ptProgress" type="range" min="0" max="0" value="0" step="0.01" aria-label="Playback position">
            <div class="player-time">
                <span id="ptTimeNow">0:00</span> / <span id="ptTimeTotal">0:00</span>
            </div>
            <label class="arr-volume">Volume <input id="ptVolume" type="range" min="0" max="100" value="100"></label>
            <meter class="audio-meter" min="0" max="1" value="0" aria-label="Audio output level" title="Audio output level"></meter>
        </div>

        <div class="player-body">
            <aside class="playlist-panel">
                <div class="panel-header">
                    <span>Playlist</span>
                    <div class="panel-actions">
                        <button id="addFilesBtn" class="btn btn-primary" type="button">+ Add</button>
                        <button id="clearUserTracksBtn" class="btn btn-ghost" type="button">Clear</button>
                        <input id="fileInput" type="file" multiple hidden
                               accept=".mid,.midi,.rmi,.xmf,.mod,.s3m,.xm,.it">
                    </div>
                </div>
                <div id="playlistItems" class="playlist-items"></div>
            </aside>
            <main class="player-stage">
                <div class="player-empty">
                    <div class="player-empty-icon">🎵</div>
                    <p id="ptTrackName">No track selected</p>
                    <p id="ptAudioState" class="audio-state" role="status">Audio off · press Play</p>
                    <p id="ptStatus" class="muted" aria-live="polite">Choose a track to preview. If voices are missing, try Compatible.</p>
                </div>
            </main>
        </div>
    </div>
</div>

<input id="openMidiInput" type="file" hidden accept=".mid,.midi,.rmi,.xmf,.mod,.s3m,.xm,.it">
<script type="module" src="./js/main.js"></script>
</body>
</html>
